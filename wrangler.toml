# ═══════════════════════════════════════════════════════════════
# BookShelf — Cloudflare Workers 설정
# worker/types.ts Bindings 인터페이스와 1:1 매핑
# ═══════════════════════════════════════════════════════════════

name = "bookshelf-api"
main = "worker/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "544c335c41ce3cd6f43b32cce9f15aaa"

# ─── 로컬 개발 ───────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ─── D1 데이터베이스 ─────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "bookshelf-db"
database_id = "013db269-dc7a-4a60-9920-ed40c12ab623"
migrations_dir = "worker/db/migrations"

# ─── KV Namespaces ───────────────────────────────────────────
# 세션 / JWT Refresh Token 저장
# (worker/routes/auth.ts POST /refresh: KV 우선 조회, 없으면 SESSIONS 폴백 후 KV로 이관)
[[kv_namespaces]]
binding = "SESSIONS"
id = "3cb76beb5e9e49b3be2373d3f2a84972"
preview_id = "5a7a6a79089849898491a7000cc5de1c"

# AI 캐시 + 범용 KV
[[kv_namespaces]]
binding = "KV"
id = "a5414ccd302444ddb71a1e8b66eb5a28"
preview_id = "350e1010be544d02826e1a6f82a0044f"

# ─── Workers Assets — SPA 정적 파일 서빙 ─────────────────────
# dist/ 빌드 결과물을 ASSETS 바인딩으로 주입 → worker/index.ts의 SPA 폴백 라우트
[assets]
directory = "./dist"
binding = "ASSETS"

# ─── R2 Object Storage ───────────────────────────────────────
# 책 표지 이미지 업로드 저장소
[[r2_buckets]]
binding = "R2"
bucket_name = "bookshelf-covers"

# ─── Workers AI ──────────────────────────────────────────────
[ai]
binding = "AI"

# ─── Durable Objects — 채팅룸 (WebSocket Hibernation) ─────────
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatRoom"]

# ─── Cron Trigger — 독서 리마인더 (15분마다 실행, 사용자별 reminder_time 슬롯과 매칭) ─
[triggers]
crons = ["*/15 * * * *"]

# ─── 환경 변수 (비밀값은 wrangler secret put 사용) ────────────
[vars]
ENVIRONMENT = "production"
APP_NAME = "BookShelf"
FRONTEND_URL = "https://bookshelf-api.kordokrip.workers.dev"
# 기능 플래그 기본값(쉼표 구분, worker/lib/featureFlags.ts 참고). 새 기능은 비워 둔 채
# 관리자 계정(전체 on)으로 먼저 검증한 뒤 여기에 추가해 전체 공개한다.
# 현재 등록된 플래그 없음 — 리뉴얼 5종은 2026-09-27 전체 공개 후 분기 코드와 함께 제거(ADR-003).
FEATURE_FLAGS = ""
# ALLOWED_EMAILS 는 wrangler secret put ALLOWED_EMAILS 로 등록 (vars와 동시 사용 불가)

# ─── 옵저버빌리티 ────────────────────────────────────────────
[observability]
enabled = true

# ─── 로컬 개발 환경 (wrangler dev --env local) ───────────────
[env.local.vars]
ENVIRONMENT = "local"

# ─── 스테이징 환경 ───────────────────────────────────────────
[env.staging]
name = "bookshelf-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
APP_NAME = "BookShelf Staging"
FRONTEND_URL = "https://bookshelf-api-staging.kordokrip.workers.dev"
FEATURE_FLAGS = "" # 단계 공개 중인 플래그를 여기에 모두 켠다 (현재 없음)

# ─── 스테이징 바인딩 ─────────────────────────────────────────────
# d1/kv/r2/ai/durable_objects/vars는 env에 상속되지 않으므로 전부 명시한다.
# (migrations, assets, observability는 최상위 설정을 상속)
# 리소스 생성: 2026-09-27 wrangler d1 create / kv namespace create / r2 bucket create
# 배포는 staging 브랜치 push → CI deploy-staging job만 사용 (로컬 wrangler deploy 금지)

[[env.staging.d1_databases]]
binding = "DB"
database_name = "bookshelf-db-staging"
database_id = "3760f0ef-30e3-4519-bcde-216b6039b890"
migrations_dir = "worker/db/migrations"

# SESSIONS는 deprecated(refresh token은 KV로 이전) — 바인딩만 유지하도록 같은 네임스페이스 공유
[[env.staging.kv_namespaces]]
binding = "KV"
id = "b758ab900d114b5b8c0ab0f1a595a35c"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "b758ab900d114b5b8c0ab0f1a595a35c"

[[env.staging.r2_buckets]]
binding = "R2"
bucket_name = "bookshelf-covers-staging"

[env.staging.ai]
binding = "AI"

[[env.staging.durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# 스테이징은 리마인더 푸시 cron을 돌리지 않는다
[env.staging.triggers]
crons = []
